plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.kragnoth.kskillsperks'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    // Pufferfish's Skills 0.19.2 (the exact jar the pack runs); production NeoForge jars use Mojang names.
    compileOnly files('libs/puffish_skills-0.19.2-1.21-neoforge.jar')
    runtimeOnly files('libs/puffish_skills-0.19.2-1.21-neoforge.jar')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version: minecraft_version, neo_version: neo_version,
                             mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Ship the licence inside the jar (as the 1.0.1 release did).
tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
}
